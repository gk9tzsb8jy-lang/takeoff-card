name: FAA declared distances
on:
  schedule:
    - cron: '17 9 * * 1'   # weekly; picks up each new 28-day FAA cycle
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/faa_dd.py, .github/workflows/faa-declared-distances.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/faa_dd.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update FAA declared distances"
          git push
