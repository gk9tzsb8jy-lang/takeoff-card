name: Runway database (FAA + OurAirports)
on:
  schedule:
    - cron: '17 9 * * 1'   # weekly; picks up each new 28-day FAA cycle
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/build_db.py, .github/workflows/faa-declared-distances.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_db.py
      - name: Commit if changed
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain tools/build-report.txt)" ]; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A runways.json sw.js tools/build-report.txt
          git commit -m "Update runway database"
          git push
